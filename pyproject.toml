[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-lookup"
version = "0.1.5"
description = "High-performance, size-optimized local ontology lookup engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "ijson>=3.5.1",
    "python-dotenv>=1.2.4",
    "cachetools>=7.2.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "httpx2>=2.13.1",
]


[dependency-groups]
dev = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "pre-commit>=4.6.2",
    "commitizen>=4.19.1",
]

[project.scripts]
ontology-lookup = "ontology_lookup.cli:main"


[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version = "1.0.0"
tag_format = "v$major.$minor.$patch"
version_files = [
    "pyproject.toml:version",
    "ontology_lookup/__init__.py:__version__",
]
bump_message = "bump: version $current_version -> $new_version"
update_changelog_on_bump = true


[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
extend-select = ["E4", "E7", "E9", "F", "I", "G", "SLF", "PTH", "Q", "T"]
ignore = ["T201", "SLF001", "UP006", "UP035", "UP045", "UP007"]
fixable = ["ALL"]
