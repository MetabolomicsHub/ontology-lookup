[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-lookup"
version = "0.1.2"
description = "High-performance, size-optimized local ontology lookup engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "ijson>=3.3.0",
    "python-dotenv>=1.0.0",
    "cachetools>=5.3.0",
    "httpx2>=2.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "httpx>=0.27.0",
    "ruff>=0.16.10",
    "pre-commit>=4.6.2",
    "commitizen>=4.19.1",
]

[project.scripts]
ontology-lookup = "ontology_lookup.cli:main"


[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version = "1.0.0"
tag_format = "v$major.$minor.$patch"
version_files = [
    "pyproject.toml:version",
    "ontology_lookup/__init__.py:__version__",
]
bump_message = "bump: version $current_version -> $new_version"
update_changelog_on_bump = true


[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
extend-select = ["E4", "E7", "E9", "F", "I", "G", "SLF", "PTH", "Q", "T"]
ignore = [  "T201", "SLF001"]
fixable = ["ALL"]
